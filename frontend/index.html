<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input id="q" placeholder="Ask something about the PDF..." />
  <button onclick="askQuestion()">Ask me</button>
  <p id="answer"></p>

  <script>
    async function askQuestion() {
      const question = document.getElementById("q").value;  // ← "q" not "input"

      if (!question.trim()) return;

      document.getElementById("answer").innerText = "Thinking....";

      try {
        const res = await fetch("http://192.168.0.166:8000/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({  query: question  })
        });
        const data = await res.json();
        document.getElementById("answer").innerText = data.answer;
      } catch (err) {
        document.getElementById("answer").innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
